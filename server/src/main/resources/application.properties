spring.application.name=messagerie

# Variables lues dans le .env de la racine du dépôt (le même que docker compose).
# « optional » : en son absence, les variables d'environnement du système sont utilisées.
spring.config.import=optional:file:../.env[.properties]

# Connexion à PostgreSQL (D-002). Aucun identifiant écrit en dur dans le code versionné.
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Schéma (D-005) : créé par schema.sql, jamais par Hibernate.
# « always » : le script est exécuté à chaque démarrage (il est idempotent).
spring.sql.init.mode=always
# « validate » : Hibernate vérifie que les entités correspondent au schéma, et refuse de
# démarrer au moindre écart. Il ne crée ni ne modifie aucune table.
spring.jpa.hibernate.ddl-auto=validate
# Ferme la session JPA à la fin du service, pas à la fin de la requête HTTP : évite des
# requêtes SQL cachées déclenchées pendant la sérialisation JSON.
spring.jpa.open-in-view=false

# Affichage du SQL généré par JPA (D-002 : savoir ce qui part réellement vers la base).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fuseau horaire explicite pour l'horodatage des messages (D-005).
app.fuseau=Europe/Paris

# JWT (D-008). Le secret vient du .env (jamais versionné) ; le serveur refuse de démarrer
# s'il est absent ou trop court. Durée de vie au format ISO-8601 : PT1H = une heure.
app.jwt.secret=${JWT_SECRET}
app.jwt.duree=PT1H

# Origines autorisées à appeler l'API et à ouvrir le canal (D-015) : les pages des clients,
# servies sur le port 8081, en local ou depuis le réseau privé (Wi-Fi, partage de connexion).
# Remplaçable par la variable d'environnement APP_ORIGINES (liste séparée par des virgules).
app.cors.origines=${APP_ORIGINES:http://localhost:8081,http://127.0.0.1:8081,http://192.168.*.*:8081,http://10.*.*.*:8081,http://172.*.*.*:8081}
