<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Messagerie mobile</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Écran 1 : connexion ou création de compte -->
  <main id="ecran-connexion" class="ecran">
    <div class="connexion">
      <h1>Messagerie</h1>
      <p class="sous-titre">Client mobile</p>
      <form id="formulaire-connexion" novalidate>
        <label>Nom d'utilisateur
          <input id="champ-username" name="username" autocomplete="username"
                 autocapitalize="none" autocorrect="off" required>
        </label>
        <label>Mot de passe
          <input id="champ-mot-de-passe" name="motDePasse" type="password"
                 autocomplete="current-password" required>
        </label>
        <p id="erreur-connexion" class="erreur" role="alert"></p>
        <button type="submit" class="principal">Se connecter</button>
        <button type="button" id="bouton-inscription" class="secondaire">Créer un compte</button>
      </form>
    </div>
  </main>

  <!-- Écran 2 : liste des contacts -->
  <main id="ecran-contacts" class="ecran" hidden>
    <header class="barre">
      <div>
        <strong id="mon-nom"></strong>
        <span id="etat-canal" class="etat-canal">connexion…</span>
      </div>
      <button id="bouton-deconnexion" class="lien">Déconnexion</button>
    </header>
    <ul id="liste-contacts" class="contacts"></ul>
    <p id="aucun-contact" class="vide" hidden>Aucun autre utilisateur pour l'instant.</p>
  </main>

  <!-- Écran 3 : conversation -->
  <main id="ecran-conversation" class="ecran" hidden>
    <header class="barre">
      <button id="bouton-retour" class="retour" aria-label="Retour aux contacts">‹</button>
      <div class="interlocuteur">
        <strong id="nom-interlocuteur"></strong>
        <span id="statut-interlocuteur" class="statut"></span>
      </div>
    </header>
    <section id="fil" class="fil" aria-live="polite">
      <button id="bouton-plus-anciens" class="lien plus-anciens" hidden>Messages plus anciens</button>
      <ol id="liste-messages" class="messages"></ol>
    </section>
    <p id="erreur-envoi" class="erreur envoi" role="alert"></p>
    <form id="formulaire-envoi" class="saisie">
      <input id="champ-message" autocomplete="off" placeholder="Message" maxlength="2000">
      <button type="submit" class="principal" aria-label="Envoyer">Envoyer</button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
